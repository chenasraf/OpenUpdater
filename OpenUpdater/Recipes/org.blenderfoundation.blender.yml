id: org.blenderfoundation.blender
name: Blender
homepage: https://www.blender.org

arch:
  arm64: arm64
  x86_64: x64

check:
  type: html
  url: https://download.blender.org/release/Blender{series}/
  pattern: 'blender-(\d+\.\d+\.\d+)-macos'
  select: latest
  resolve:
    series:
      url: https://download.blender.org/release/
      pattern: 'href="Blender(\d+\.\d+)/"'
      select: latest

download:
  url: https://download.blender.org/release/Blender{major}.{minor}/blender-{version}-macos-{arch}.dmg
  format: dmg

channels:
  - id: latest
    name: Latest
  - id: lts
    name: LTS
    check:
      type: html
      url: https://download.blender.org/release/Blender{series}/
      pattern: 'blender-(\d+\.\d+\.\d+)-macos'
      select: latest
      resolve:
        series:
          url: https://developer.blender.org/docs/release_notes/
          pattern: '>Blender (\d+\.\d+) LTS</a>(?:</strong>)? <em>\((?!alpha|beta)'
          select: latest
