id: com.srikanthnani.pluely
name: Pluely
homepage: https://pluely.com

arch:
  arm64: aarch64
  x86_64: x64

check:
  type: github_releases
  repo: iamsrikanthnani/pluely
  prereleases: false
  tag_pattern: '^app-v'

version:
  strip_prefix: app-v

download:
  url: https://github.com/iamsrikanthnani/pluely/releases/download/{tag}/Pluely_{version}_{arch}.dmg
  format: dmg

changelog:
  url: https://github.com/iamsrikanthnani/pluely/releases/tag/{tag}
